# Product identity and foundation-wide settings.
#
# Loaded in config/application.rb and exposed everywhere as
# Rails.configuration.x.foundation (keys work as strings or symbols).
shared:
  # Display name used in page titles, meta tags, and mail.
  application_name: "NanoPet"

  # Absolute URL or asset path for the product logo. Blank renders a
  # plain wordmark instead.
  logo_url: ""

  # Seed color the Material Design 3 token generator will derive light
  # and dark palettes from.
  brand_seed_color: "#6750A4"

  # Fallbacks for pages that do not set their own title/description.
  default_page_title: "Your little companion is waiting"
  default_page_description: "A tamagotchi-style virtual pet that lives in the browser: feed it, play with it, put it to rest, and keep it alive. Stats decay over real time and persist across reloads."

  # Absolute URL of the default Open Graph / social sharing image.
  # Blank omits the og:image tag.
  default_og_image_url: ""

  # Public social profiles, e.g. { github: "https://github.com/example" }.
  # Empty means no social links are rendered.
  social_links: {}

  # Operator mailboxes surfaced in support links and legal pages.
  support_email: "support@nanopet.api.holode.xyz"
  legal_email: "legal@nanopet.api.holode.xyz"

  # Canonical production domain, no scheme. Used for sitemaps and
  # absolute URLs in mail.
  domain: "nanopet.api.holode.xyz"

  # Product surface: which foundation chrome this generated app exposes.
  # Modules control what code is on disk; the surface controls what the
  # signed-in and public shells offer for *this* product. Features must
  # only appear when they belong to the app being built.
  # Profiles: platform | commerce | workspace | consumer
  # See docs/PRODUCT_SURFACE.md.
  product_surface: platform

  # Optional boolean overrides on top of the profile (feature name → true/false).
  # Example: { billing: true } on a commerce surface.
  product_surface_features: {}

  # Design skin: product-family visual language layered on MD3 tokens.
  # material | commerce | workspace | arcade | vault | signal
  # Blank/default pairs from product_surface (see docs/DESIGN_SKINS.md).
  design_skin: material

  # Public TCG dataset (novaoc/rarebox-data). Enable for any catalog,
  # portfolio, or pricing feature that touches TCG marks.
  # See docs/RAREBOX_DATA.md.
  rarebox_data:
    enabled: false
    game: pokemon
    path: ""
    remote: "https://raw.githubusercontent.com/novaoc/rarebox-data/main"

  # Host capacity ceilings for /healthcheck disk and memory probes (percent used).
  # Probes pass with an informational note when the platform cannot report figures.
  healthcheck_disk_usage_percent_max: 90
  healthcheck_memory_usage_percent_max: 90

  # Native mobile shell (SPEC M14). Association identifiers stay empty until
  # an operator fills them; unconfigured association endpoints return 404.
  # Path-configuration JSON does not embed these values.
  native:
    # Apple Universal Links: "{TeamID}.{bundle.id}" (e.g. ABCDE12345.com.example.app).
    ios_app_id: ""
    # Paths claimed for Universal Links. Default claims the whole site.
    ios_paths:
      - "*"
    # Android App Links package name (applicationId).
    android_package_name: ""
    # SHA-256 cert fingerprints of the signing key(s), colon-separated hex.
    android_sha256_cert_fingerprints: []
